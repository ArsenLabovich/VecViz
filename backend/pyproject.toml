[project]
name = "vecviz-backend"
version = "0.1.0"
description = "3D Vector DB Visualizer — FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.9.0",
    "openai>=2.30.0",
    "sentence-transformers>=5.3.0",
    "umap-learn>=0.5.11",
    "pacmap>=0.7.3",
    "scikit-learn>=1.8.0",
    "numpy>=2.4.0",
    "qdrant-client>=1.17.0",
    "langchain-text-splitters>=0.3.0",
    "tiktoken>=0.12.0",
    "pypdf>=5.0.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.22",
    "httpx>=0.28.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
